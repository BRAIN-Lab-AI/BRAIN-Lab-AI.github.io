<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Members | BRAIN Lab</title>
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #eef2f3 0%, #ffffff 100%);
            --navy: #1a2a6c;
            --accent: #1a2a6c; 
            --block-accent: #c8a355;
            --text-gray: #444;
            --card-bg: #fbfbfb;
            --scroll-bg: #f0f0f0;
        }

        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            line-height: 1.6; 
            color: var(--text-gray); 
            margin: 0; 
            background-color: #ffffff; 
        }

        header { 
            background: #ffffff; 
            padding: 0px 0px; 
            text-align: center; 
            border-bottom: none;
        }

        nav { 
            background: #ffffff; 
            text-align: center; 
            position: sticky; 
            top: 0; 
            z-index: 1000; 
            border-bottom: 6px solid #f4f7f9; /* The light color below the tabs */
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
        }
        
        nav a { 
            color: #555; 
            padding: 15px 30px;    /* Reduced from 25px 45px */
            text-decoration: none; 
            display: inline-block; 
            font-weight: 700; 
            font-size: 1rem;       /* Reduced from 1.2rem */
            transition: all 0.3s ease; 
            text-transform: uppercase; 
            letter-spacing: 0.5px; /* Reduced from 1px */
        }
        nav a:hover { color: var(--navy); background: #f0f4f8; }
        nav a.active { color: white; background: var(--navy); }

        .container { max-width: 1100px; margin: 0 auto; padding: 0 30px; }
        
        h2 { 
            color: var(--navy); 
            border-left: 5px solid var(--accent); 
            padding-left: 15px;    /* Slightly reduced padding */
            margin-top: 40px;      /* Reduced from 60px to bring sections closer */
            font-size: 1.6rem;     /* Reduced from 2.2rem */
            margin-bottom: 20px;   /* Reduced from 30px */
        }

        /* Grid wrapper: 3-4 members per row depending on screen width */
        .member-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 25px;
            margin-bottom: 10px;
        }

        /* Member Card Styling - vertical layout: photo, name, affiliation, interest */
        .member-card { 
            background: white; 
            padding: 30px 20px; 
            border-radius: 12px; 
            border: 1px solid #efefef;
            border-top: 5px solid var(--block-accent); /* Matches your news card style */
            display: flex; 
            flex-direction: column;
            align-items: center;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
            transition: all 0.2s ease-in-out;
        }
        
        .member-card:hover { 
            transform: translateY(-6px); 
            box-shadow: 0 8px 20px rgba(0,0,0,0.08); 
        }

        .member-photo { 
            width: 110px; 
            height: 110px; 
            border-radius: 50%; 
            object-fit: cover; 
            margin-bottom: 18px; 
            border: 3px solid #f4f7f9; 
        }

        .member-info h3 { 
            margin: 0 0 6px 0; 
            color: var(--navy); 
            font-size: 1.2rem;
        }

        .member-info .affiliation {
            margin: 0 0 8px 0;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--block-accent);
            /* text-transform: uppercase; */
            letter-spacing: 0.5px;
        }

        .member-info .interest {
            margin: 0;
            font-size: 0.92rem;
            color: var(--text-gray);
        }

        .member-info .interest2 {
            margin: 0;
            font-family: 'Fira Code', 'Consolas', 'Courier New', monospace;
            background: #1e1e2e;
            color: #a6e3a1;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.82rem;
            display: inline-block;
            line-height: 1.4;
        }

        .links {
            margin-top: 14px;
        }

        .links a { 
            font-size: 0.85rem; 
            color: var(--navy); 
            text-decoration: underline; 
            text-decoration-color: var(--accent);
            margin: 0 8px; 
            font-weight: bold; 
        }
        
        .links a:hover { 
            color: var(--accent); 
        }

        footer { text-align: center; padding: 60px 20px; color: #999; border-top: 1px solid #eee; margin-top: 80px; }
    </style>
</head>
<body>
